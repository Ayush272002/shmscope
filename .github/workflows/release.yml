name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options: [patch, minor, major]

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CMake 4.2
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.2"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Conan
        run: |
          uv sync --no-dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan2-${{ runner.os }}-appleclang-release-14-${{ hashFiles('**/conanfile.py') }}
          restore-keys: |
            conan2-${{ runner.os }}-appleclang-release-14-

      - name: Configure Conan
        run: |
          conan profile detect --force
          sed -i '' 's/compiler.cppstd=.*/compiler.cppstd=23/' ~/.conan2/profiles/default

      - name: Compute next version
        id: bump
        run: |
          VERSION=$(uv version --bump ${{ inputs.bump }} --dry-run --short)
          echo "$VERSION" > VERSION
          uv version "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        id: package
        run: |
          NAME="shmscope-v${{ steps.bump.outputs.version }}-macos-arm64"
          mkdir -p "dist/$NAME/bin" "dist/$NAME/examples"
          cp build/shmscope "dist/$NAME/bin/"
          strip "dist/$NAME/bin/shmscope"
          cp LICENSE README.md "dist/$NAME/"
          cp examples/ring.ksy examples/ring.yaml examples/ring.json "dist/$NAME/examples/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "dist/$NAME.tar.gz.sha256")" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION pyproject.toml uv.lock
          git commit -m "release: v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD --tags

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            "dist/${{ steps.package.outputs.name }}.tar.gz" \
            "dist/${{ steps.package.outputs.name }}.tar.gz.sha256" \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes

      - name: Open a Homebrew tap PR
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          NAME: ${{ steps.package.outputs.name }}
          SHA: ${{ steps.package.outputs.sha256 }}
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${NAME}.tar.gz"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Ayush272002/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -E \
            -e "s|^  url \".*\"|  url \"${URL}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" \
            packaging/homebrew/shmscope.rb > tap/Formula/shmscope.rb

          cd tap
          BRANCH="shmscope-${VERSION}"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/shmscope.rb
          git commit -m "shmscope ${VERSION}"
          git push origin "$BRANCH"

          gh pr create \
            --repo Ayush272002/homebrew-tap \
            --base main \
            --head "$BRANCH" \
            --title "shmscope ${VERSION}" \
            --body "Release: https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"
