name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options: [patch, minor, major]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-cpp
        with:
          cache-suffix: relwithdebinfo

      - name: Configure
        run: cmake --preset relwithdebinfo

      - name: Build
        run: cmake --build --preset relwithdebinfo

      - name: Test
        run: ctest --preset relwithdebinfo

      - name: Compute next version
        id: bump
        run: |
          NEW_VERSION=$(uv version --bump ${{ github.event.inputs.bump }} --dry-run --short)
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Write VERSION file
        run: echo "${{ steps.bump.outputs.version }}" > VERSION

      - name: Sync pyproject.toml to match
        run: uv version "${{ steps.bump.outputs.version }}"

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION pyproject.toml uv.lock
          git commit -m "release: v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD --tags
