name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cpp
        with:
          cache-suffix: release

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

  macos:
    name: macos ${{ matrix.name }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build
            preset: release
          - name: asan
            preset: asan
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake 4.2
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.2"

      - name: Install Ninja
        run: brew install ninja

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Conan
        run: uv sync --no-dev

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan2-${{ runner.os }}-appleclang-${{ matrix.preset }}-${{ hashFiles('**/conanfile.py') }}
          restore-keys: |
            conan2-${{ runner.os }}-appleclang-${{ matrix.preset }}-

      - name: Configure Conan
        run: |
          .venv/bin/conan profile detect --force
          sed -i '' 's/compiler.cppstd=.*/compiler.cppstd=23/' ~/.conan2/profiles/default
          .venv/bin/conan profile show
          clang++ --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cpp
        with:
          cache-suffix: coverage

      - name: Configure
        run: cmake --preset coverage

      - name: Build
        run: cmake --build --preset coverage

      - name: Test
        run: ctest --preset coverage

      - name: Coverage report
        run: |
          llvm-profdata-21 merge -sparse cmake-build-coverage/shmscope-*.profraw \
            -o cmake-build-coverage/shmscope.profdata
          llvm-cov-21 report cmake-build-coverage/shmscope_tests \
            -instr-profile=cmake-build-coverage/shmscope.profdata \
            -ignore-filename-regex='(tests/|benchmark/|examples/|gtest|\.conan2|_deps/)'
          BRANCH_COVER=$(llvm-cov-21 export cmake-build-coverage/shmscope_tests \
            -instr-profile=cmake-build-coverage/shmscope.profdata \
            -ignore-filename-regex='(tests/|benchmark/|examples/|gtest|\.conan2|_deps/)' \
            -summary-only | python3 -c "import json,sys; print(json.load(sys.stdin)['data'][0]['totals']['branches']['percent'])")
          echo "Branch coverage: ${BRANCH_COVER}%"
          python3 -c "import sys; sys.exit(0 if float('${BRANCH_COVER}') >= 80 else 1)"

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cpp
        with:
          cache-suffix: asan

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      - name: Test under ASan and UBSan
        run: ctest --preset asan

  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cpp
        with:
          cache-suffix: tsan

      - name: Configure
        run: cmake --preset tsan

      - name: Build
        run: cmake --build --preset tsan

      - name: Test under TSan and UBSan
        run: ctest --preset tsan

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cpp
        with:
          cache-suffix: valgrind

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        timeout-minutes: 30
        run: |
          valgrind \
            --error-exitcode=1 \
            --log-file=valgrind-%p.log \
            --leak-check=full \
            --show-leak-kinds=definite,indirect \
            --errors-for-leak-kinds=definite,indirect \
            --track-origins=yes \
            ./cmake-build-debug/shmscope_tests \
            --gtest_filter=-ReaderFileTest.FileAtTheSizeLimitIsRead

      - name: Valgrind reports
        if: failure()
        run: |
          for log in valgrind-*.log; do
            echo "=== ${log} ==="
            cat "${log}"
          done

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx pre-commit run --all-files --show-diff-on-failure
