[project]
name = "shmscope"
version = "0.1.4"
description = "Live terminal viewer for POSIX shared memory."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Ayush Acharjya", email = "ayushacharjya@gmail.com" }
]
keywords = ["shared-memory", "posix", "shm", "tui", "terminal", "hex-viewer", "kaitai", "debugging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.14"
dependencies = [
    "conan>=2.32.0",
]

[project.urls]
Homepage = "https://shmscope.ayushacharjya.com/"
Documentation = "https://shmscope.ayushacharjya.com/"
Repository = "https://github.com/Ayush272002/shmscope"
Issues = "https://github.com/Ayush272002/shmscope/issues"
Releases = "https://github.com/Ayush272002/shmscope/releases"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
